apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "triton-vllm.fullname" . }}
  labels:
    {{- include "triton-vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "triton-vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "triton-vllm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: triton
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - tritonserver
        args:
          - --model-repository={{ .Values.model.repository }}
          - --log-verbose={{ .Values.triton.logVerbose }}
          - --strict-model-config={{ .Values.triton.strictModelConfig }}
          - --exit-on-error={{ .Values.triton.exitOnError }}
          - --min-supported-compute-capability={{ .Values.triton.minSupportedComputeCapability }}
          - --backend-directory={{ .Values.triton.backendDirectory }}
          - --repoagent-directory={{ .Values.triton.repoAgentDirectory }}
        ports:
        - name: http
          containerPort: {{ .Values.service.httpPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.service.grpcPort }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.service.metricsPort }}
          protocol: TCP
        env:
        {{- toYaml .Values.env | nindent 8 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: model-storage
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: {{ include "triton-vllm.fullname" . }}-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
