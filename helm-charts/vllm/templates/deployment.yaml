apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: vllm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --model
          - {{ .Values.model.name }}
          - --tensor-parallel-size
          - "{{ .Values.vllm.tensorParallelSize }}"
          - --max-model-len
          - "{{ .Values.vllm.maxModelLen }}"
          - --gpu-memory-utilization
          - "{{ .Values.vllm.gpuMemoryUtilization }}"
          - --dtype
          - {{ .Values.vllm.dtype }}
          - --max-num-batched-tokens
          - "{{ .Values.vllm.maxNumBatchedTokens }}"
          - --max-num-seqs
          - "{{ .Values.vllm.maxNumSeqs }}"
          {{- if .Values.vllm.enablePrefixCaching }}
          - --enable-prefix-caching
          {{- end }}
          - --host
          - "0.0.0.0"
          - --port
          - "{{ .Values.service.targetPort }}"
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        {{- toYaml .Values.env | nindent 8 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: model-storage
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: {{ include "vllm.fullname" . }}-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
